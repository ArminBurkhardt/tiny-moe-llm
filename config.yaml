model:
  vocab_size: 65536 # gemma: 262144 -- pruned to fit uint16 train.bin (Step 8), was 129280
  max_seq_length: 4096
  hidden_size: 768 # was 512 -- 512 kept every GEMM skinny and MFU low
  intermediate_size: 2304 # dense decoder MLP only
  moe_intermediate_size: 2304 # routed + shared MoE experts only, defaults to intermediate_size if absent
  num_layers: 8 # was 5
  num_attention_heads: 12 # was 8
  head_dim: 64
  dropout: 0.00 # for pretraining only
  per_layer_embeddings_size: 32

  # num experts
  num_mlp_experts: 32 # was 36 -- end of the free-lunch total-params-at-zero-active-compute range, see PLAN.md Step 5
  num_attn_experts: 1

  # routing
  top_k: 2
  n_loops: 3 # was 4 -- non-MLP experts run densely every loop, so fewer loops means fewer dense attention passes

  # information retrieval
  num_ir_experts: 1
  num_ir_entries: 65536 # was 8192. The 8192 x 128 table measured 99.5% of maximum retrieval entropy
                        # and zeroing its read cost 0.0004 nats of held-out CE -- it stored nothing,
                        # so growing it costs nothing to throw away. It only grows because the two
                        # stage read below makes 65536 entries cheaper to score than 8192 were.
  ir_dim: 256 # was 128. A 128-d key/value is a thin thing to store an atom of content in, and the
              # dimension has to match the external evidence path's adapter output later anyway.
  # two stage scoring: probe ir_probe_clusters of ir_num_clusters centroids, score those clusters'
  # members exactly, softmax-read the best ir_read_top_k of them. Full scoring at 65536 x 256 is
  # ~275 GFLOP per loop at 8192 tokens and materializes a multi-GB softmax per loop; this is ~2% of
  # that. It is also the same retrieve-then-read shape the external corpus will use, deliberately.
  # 0 clusters = the exact full-table path every pre-reshape checkpoint was trained under.
  ir_num_clusters: 256 # must divide num_ir_entries; capacity is 65536/256 = 256 entries per cluster
  ir_probe_clusters: 4 # -> ~1024 candidates scored exactly per token. Raise it if the refresh's
                       # measured candidate recall@32 drops below ~0.9 -- a centroid path that
                       # silently misses the true top-k turns the temperature anneal into noise
  ir_read_top_k: 32

  # mtp
  mtp_num_extra_tokens: 2
  lm_head_factor: 4

training:
  batch_size: 8
  seq_length: 4096
  lr: 4e-4
  weight_decay: 0.02
  grad_clip: 1.0
  num_epochs: 1 # was 10 -- training now stops at target_tokens (PLAN.md Step 6), not a fixed epoch count
  lambda_mtp: 0.1
  aux_loss_weight: 0.01 # load balancing loss coefficient
  target_tokens: 16000000000 # Budget decision (PLAN.md): prepared data caps phase1+phase2 combined at 30B
                             # tokens, and Gate 4's local 5090 measurement (31.8% MFU, BF16-only, grad_accum=4,
                             # already clears the ~18% MFU threshold PLAN.md calls data- vs budget-limited) makes
                             # it very likely the real H100+FP8 run lands in the data-limited regime, so the EUR
                             # 100/47h budget-hours table doesn't bind -- rounded down from the 30B data cap
                             # scaled by Step 8's measured fertility regression (manifest.json
                             # fertility_regression._overall = 0.15439%, i.e. 30B * (1 - 0.0015439) ~= 29.954B).
                             # Combined phase1+phase2, not either phase alone. Correct via the Vast.ai runbook's
                             # Step 4 FP8 smoke test if real tokens/sec differs from the Gate 4 extrapolation by
                             # >20% -- the last cheap moment to fix this.
  warmup_steps: 1000 # linear LR warmup before cosine decay
  noise_anneal_tokens: 1000000000 # decay router exploration noise 1->0 over the first 1b tokens
  loop_ce_weights: [0.2, 0.3, 1.0] # per-loop CE weight, ascending; len must == model.n_loops
  loop_ce_subsample: 0.25 # fraction of token positions supervised on the NON-final loops (final
                          # loop is always supervised in full). the LM head is the largest GEMM in
                          # the model and per-loop CE runs it once per loop; a CE mean over a
                          # uniform subsample is an unbiased estimate of the full mean, so this
                          # trades variance on the low-weight intermediate readouts for throughput.
                          # 1.0 disables it.
  loop_count_sampling: 0.3 # probability that a training step runs a RANDOMLY REDUCED number of
                           # loops (uniform over 1..n_loops-1) instead of the full n_loops. Trains
                           # every depth as a real operating point rather than an incidental one,
                           # so the loop count stays a runtime choice at inference; also cuts mean
                           # training compute. loop_ce_weights is truncated and rescaled so the
                           # deepest loop actually run always carries weight 1.0. 0.0 disables it.
  grad_accumulation_steps: 16
  seed: 42
  data_dir: "data/prepared" # dir holding {phase}.bin/.idx from scripts/prepare_data.py (Step 11)
  phase: "phase1" # which {phase}.bin/.idx pair to train on
  checkpoint_every_tokens: 400000000 # ~30 min at 200K tok/s. expressed in TOKENS, not steps: the
                                     # old `step % 1500` counted MICRO steps, so at grad_accum 16
                                     # it fired every ~49M tokens (~4 min, ~608 checkpoints,
                                     # ~1.2TB against a 120GB disk). tokens also make the cadence
                                     # invariant to batch size / grad accum changes.
  keep_local_checkpoints: 2 # rolling checkpoints kept on disk. a checkpoint is only deleted once
                            # it is BOTH outside this window AND confirmed uploaded -- see
                            # modules/runtime/checkpoints.prune_checkpoints for why.
  phase1_fraction: 0.85 # PLAN.md's 85/15 split. phase 1 stops here; phase 2 runs to target_tokens.
  hf_upload_repo: "ikeafisch4/temp-train" # "" disables uploads (local runs); delete the key
                                          # entirely to fall back to utils.HF_UPLOAD_REPO

sft: # Runs LOCALLY on the dev GPU -- the pretrained checkpoint and manifest.json come down from the
     # Hub once pretraining finishes. Loss weights (lambda_mtp, aux_loss_weight,
     # loop_ce_weights/subsample, loop_count_sampling) are deliberately NOT duplicated
     # here: SFT reuses pretrain.train_step unchanged, so the objective is identical by
     # construction rather than by two copies agreeing.
  data_dir: "data/prepared"
  train_split: "sft_train"
  val_split: "sft_val"
  batch_size: 8 # what the real SFT run used. NOTE this is measured at 29.55GB peak allocated on the
                # 32GB 5090, which pushes total driver usage to ~32.0GB and spills into shared
                # system memory (~4x throughput loss). `repair:` below drops to 4 and doubles the
                # accumulation instead; do the same here before any further local SFT run
  seq_length: 4096 # same as pretraining: packing means a shorter row wouldn't save anything, and a
                   # longer max_doc_tokens keeps more of smoltalk2's conversations
  grad_accumulation_steps: 4 # ~131k tokens per optimizer step
  lr: 3.0e-5 # ~1/13 of pretraining's 4e-4. Standard SFT territory, and the reason
             # scripts/sft.py shadows EVERY parameter in fp32 rather than only the no_decay group:
             # at this LR an AdamW step on a bf16 2D weight is below its own ulp (see
             # build_sft_param_groups' docstring for the arithmetic).
  weight_decay: 0.01
  # deliberately no grad_clip / lambda_* here: pretrain.train_step reads those from `training:`
  # above, and a duplicate key that silently does nothing is worse than no key
  num_epochs: 2
  warmup_fraction: 0.03 # linear warmup as a fraction of total steps, then cosine to lr_min
  lr_min_factor: 0.05 # cosine floor as a fraction of lr
  dropout: 0.05 # pretraining ran 0.0; a small amount here since SFT repeats a much smaller corpus
  seed: 1234 # seeds the per-epoch document permutation, so it must stay stable across resumes
  checkpoint_every_tokens: 100000000 # ~6 saves over a 2-epoch/300M-token corpus. An SFT checkpoint
                                     # is ~3.3GB, not pretraining's ~2GB: every parameter is
                                     # stepped through an fp32 master, so AdamW's two moments are
                                     # fp32 (2.7GB) instead of bf16. At 25M this was ~24 saves,
                                     # ~79GB of uploads on a ~3h run.
  keep_local_checkpoints: 3
  eval_every_tokens: 25000000 # decoupled from (and 4x more frequent than) the checkpoint cadence:
                              # the validation pass is seconds, and its p_max/top-1 reading on a
                              # fixed slice is the early warning for the abstention criterion
  eval_max_batches: 40 # cap on the validation pass, so it stays a couple of seconds
  conversation_loss_weighting: false # false = plain per-token CE, i.e. the objective the existing
                                     # SFT checkpoint was trained under. `repair:` below turns it on
  hf_upload_repo: "" # local run: uploads off by default. Set a repo id (or pass --upload) to mirror
                     # SFT checkpoints to the Hub like the pretraining run does.

repair: # NEXT.md Phase 2: the abstention repair finetune, `python scripts/sft.py --repair`.
        # Read by config.py's RepairConfig, which SUBCLASSES SFTConfig -- every key omitted here
        # (batch size, seq length, dropout, warmup, eval_max_batches) inherits `sft:` above, on
        # purpose: this is the same objective and the same shape over a repaired corpus, and a
        # second copy of those numbers is a second thing to keep in sync.
        # Runs LOCALLY on the 5090 in BF16 (do not set USE_FP8).
  train_split: "repair_train" # from `python scripts/prepare_sft_data.py --profile repair`
  val_split: "repair_val"
  lr: 1.0e-5 # ~1/3 of SFT's. The trunk is already post-SFT; this pass moves the abstention decision,
             # it does not relearn the chat format. Every parameter is still fp32-shadowed (the
             # ulp arithmetic in build_sft_param_groups only gets worse at a lower LR).
  num_epochs: 1 # one pass over ~50M tokens. Two would start memorizing the repair corpus's own
                # answers, which is the failure this whole phase is undoing
  batch_size: 4 # NOT inherited: `sft:`'s 8 peaks at 29.55GB allocated on this 32GB 5090, and the
                # driver then backs the rest with SHARED (system) memory instead of failing --
                # measured 32,057 of 32,607 MiB in use at 9.4k tokens/sec, roughly a quarter of what
                # the card does when it stays resident. Halving the micro batch halves the
                # activations (weights + fp32 masters + Adam moments are a fixed ~4.7GB) and is
                # invisible to the objective, since grad_accumulation_steps below restores the
                # tokens per optimizer step exactly
  grad_accumulation_steps: 4 # 4 x 4096 x 4 = ~65k tokens/optimizer step, half of SFT's ~131k. The
                             # corpus is 14x smaller than SFT's, so at SFT's tokens/step this pass
                             # would be ~380 optimizer steps total; this buys ~830 without touching
                             # the objective
  checkpoint_every_tokens: 10000000 # ~5 saves over the corpus; SFT's 100M would give zero
  eval_every_tokens: 5000000
  conversation_loss_weighting: true # Phase 2 fix #3: weight by 1/(supervised tokens in the
                                    # conversation), so a ~6-token refusal stops mechanically
                                    # out-earning a multi-sentence real answer
  hf_upload_repo: "" # local run