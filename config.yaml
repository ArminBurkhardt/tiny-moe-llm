model:
  vocab_size: 65536 # gemma: 262144 -- pruned to fit uint16 train.bin (Step 8), was 129280
  max_seq_length: 4096
  hidden_size: 768 # was 512 -- 512 kept every GEMM skinny and MFU low
  intermediate_size: 2304 # dense decoder MLP only
  moe_intermediate_size: 2304 # routed + shared MoE experts only, defaults to intermediate_size if absent
  num_layers: 8 # was 5
  num_attention_heads: 12 # was 8
  head_dim: 64
  dropout: 0.00 # for pretraining only
  per_layer_embeddings_size: 32

  # num experts
  num_mlp_experts: 32 # was 36 -- end of the free-lunch total-params-at-zero-active-compute range, see PLAN.md Step 5
  num_attn_experts: 1

  # routing
  top_k: 2
  n_loops: 3 # was 4 -- non-MLP experts run densely every loop, so fewer loops means fewer dense attention passes

  # information retrieval
  num_ir_experts: 1
  num_ir_entries: 8192 # was 16384 -- dense every loop, ~11% of forward FLOPs, halving frees throughput + ~2GB peak mem
  ir_dim: 128

  # mtp
  mtp_num_extra_tokens: 2
  lm_head_factor: 4

training:
  batch_size: 8
  seq_length: 4096
  lr: 4e-4
  weight_decay: 0.02
  grad_clip: 1.0
  num_epochs: 1 # was 10 -- training now stops at target_tokens (PLAN.md Step 6), not a fixed epoch count
  lambda_mtp: 0.1
  aux_loss_weight: 0.01 # load balancing loss coefficient
  target_tokens: 45000000 # GATE4 TEST -- real value: 5000000000 (see config.yaml.real_backup). Scaled to the
                          # ~50M-token local phase1 slice from prepare_data.py's smoke run, leaving ~5M tokens
                          # margin so the mmap dataset's single epoch doesn't run out mid-run.
  warmup_steps: 30 # GATE4 TEST -- real value: 1000. At grad_accumulation_steps=4 this is ~3.9M tokens (~9% of
                   # the 45M target); the real 1000 steps would be ~524M tokens, more than this whole test run.
  noise_anneal_tokens: 10000000 # GATE4 TEST -- real value: 1000000000, scaled proportionally down
  lambda_ponder: 0.05 # GATE4 TEST -- was 3e-3, then 0.5. Two measured points now bracket the band:
                     # 3e-3 -> p_halt plateaus ~0.003-0.006 (CE gradient dominates, never enters
                     # band); 0.5 -> p_halt plateaus ~0.73-0.75 (ponder dominates, loop's (1-p_halt)
                     # update gets ~75% muted, which is why the idx1380 loss curve goes flat right
                     # as p_halt climbs -- ponder was strangling the mechanism it's meant to just
                     # discourage). Treating p_halt as sigmoid(a + b*ln(lambda)) and fitting those
                     # two points targets p_halt~0.15 (mid-band) at lambda~0.05 -- extrapolated, not
                     # independently measured. Read off the real Gate 4 run's own logs rather than
                     # spending another dedicated test-config run on it.
  ponder_warmup_tokens: 8000000 # GATE4 TEST -- real value: 1000000000. Ponder turns on at ~18% into the run so
                                # there's still runway afterward to check loop_scale doesn't collapse once it does.
  ponder_ramp_tokens: 8000000 # GATE4 TEST -- real value: 1000000000. Full lambda_ponder weight by ~36% into the
                              # run, leaving ~64% of the run (~29M tokens) at steady state to watch for deadlock.
  loop_ce_weights: [0.2, 0.3, 1.0] # per-loop CE weight, ascending; len must == model.n_loops
  loop_ce_subsample: 0.25 # fraction of token positions supervised on the NON-final loops (final
                          # loop is always supervised in full). the LM head is the largest GEMM in
                          # the model and per-loop CE runs it once per loop; a CE mean over a
                          # uniform subsample is an unbiased estimate of the full mean, so this
                          # trades variance on the low-weight intermediate readouts for throughput.
                          # 1.0 disables it.
  loop_count_sampling: 0.3 # probability that a training step runs a RANDOMLY REDUCED number of
                           # loops (uniform over 1..n_loops-1) instead of the full n_loops. Trains
                           # every depth as a real operating point rather than an incidental one,
                           # so the loop count stays a runtime choice at inference; also cuts mean
                           # training compute. loop_ce_weights is truncated and rescaled so the
                           # deepest loop actually run always carries weight 1.0. 0.0 disables it.
  lambda_conf: 0.05 # weight on the correctness head's BCE loss (final loop only)
  grad_accumulation_steps: 4 # GATE4 TEST -- real value: 16. Tokens/step drops from 524,288 to 131,072, giving
                             # ~343 optimizer steps (vs ~95) over the 45M budget -- more LOG_INTERVAL=10 points
                             # to actually see loss/loop_scale/p_halt curves move, at the cost of noisier gradients
                             # and a (slightly) different tokens/sec profile than the real grad_accum=16 config.
  seed: 42
  data_dir: "data/prepared" # dir holding {phase}.bin/.idx from scripts/prepare_data.py (Step 11)
  phase: "phase1" # which {phase}.bin/.idx pair to train on 