model:
  vocab_size: 129280 # gemma: 262144
  max_seq_length: 4096
  hidden_size: 512
  intermediate_size: 2048
  num_layers: 5
  num_attention_heads: 8
  head_dim: 64
  dropout: 0.00 # for pretraining only
  per_layer_embeddings_size: 32

  # num experts
  num_mlp_experts: 36 # due to fp8 requirement, this + other experts must be divisible by 8
  num_attn_experts: 1

  # routing
  top_k: 2
  n_loops: 4
  identity_skew: 0.8 # higher values encourage choosing the identity

  # information retrieval
  num_ir_experts: 1
  num_ir_entries: 16384
  ir_dim: 128

  # mtp
  mtp_num_extra_tokens: 2
  lm_head_factor: 4

training:
  batch_size: 8
  seq_length: 4096
  lr: 4e-4
  weight_decay: 0.02
  grad_clip: 1.0
  num_epochs: 10
  lambda_mtp: 0.1
  aux_loss_weight: 0.01 # load balancing loss coefficient
  target_tokens: 5000000000 # 5b tokens
  warmup_steps: 1000 # linear LR warmup before cosine decay
  noise_anneal_tokens: 1000000000 # decay router exploration noise 1->0 over the first 1b tokens
  grad_accumulation_steps: 16
  seed: 42
  max_tokens_per_shard: 200000000 # 200m tokens per shard 