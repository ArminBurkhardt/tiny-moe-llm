# the 99M shape for the from-scratch pilot: width 512, 6 prelude layers, 8 MLP experts top 2, seq
# 4096, key/value reader (set by sft.py --reader-kv on the seed). select it with
# TINY_LLM_CONFIG=config_pilot.yaml. relative to the repo root. every model: and training: key
# config.py reads is present here. both arms run on this file: the control arm's split carries no
# evidence, so the selection and groundedness terms are never computed there and their weights are
# inert; one file keeps every other number identical by construction
model:
  vocab_size: 65536          # same tokenizer and uint16 corpus as the full shape
  max_seq_length: 4096
  hidden_size: 512
  intermediate_size: 1536
  moe_intermediate_size: 1536
  num_layers: 6
  num_attention_heads: 8     # 2 kv heads
  head_dim: 64
  dropout: 0.0
  per_layer_embeddings_size: 16
  num_mlp_experts: 8
  num_attn_experts: 1
  top_k: 2
  n_loops: 3
  num_ir_experts: 1
  num_ir_entries: 256
  ir_dim: 384                # bge width, the external keys arrive at it
  ir_num_clusters: 0         # exact read, no centroids
  ir_probe_clusters: 4
  ir_read_top_k: 32
  ir_direct_read: true
  evidence_encoder: true
  mtp_num_extra_tokens: 2
  lm_head_factor: 4

training:                    # loss weights, read by train_step for every profile
  batch_size: 8
  seq_length: 4096
  lr: 6.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  num_epochs: 1
  lambda_mtp: 0.1
  aux_loss_weight: 0.01
  evidence_selection_weight: 0.1
  groundedness_weight: 0.1   # the seed carries the head (migrate_groundedness_head.py); gated on labels
  target_tokens: 1000000000
  warmup_steps: 0
  noise_anneal_tokens: 0
  loop_ce_weights: [0.2, 0.3, 1.0]
  loop_ce_subsample: 0.25
  loop_count_sampling: 0.3
  grad_accumulation_steps: 1
  seed: 42
  data_dir: "data/prepared_pilot"
  phase: "phase1"
  hf_upload_repo: ""

sft:
  data_dir: "data/prepared_pilot"
  seq_length: 4096
  dropout: 0.0
  hf_upload_repo: ""

evidence:
  train_split: "pilot_warm_train"      # every launch passes --train-split; the switch relaunches on pilot_main_train
  val_split: "inject_val"              # filler only, identical for every arm
  fixed_split: "evidence_fixed"        # the held-out QA pass; a copy of data/prepared's build with its .src
  fixed_eval_max_batches: 100
  kill_tokens: 0                       # read, never killed: the gates are decided by hand
  kill_min_gain: 0.1
  freeze_evidence_gate: true
  lr: 6.0e-4                           # a guess for 99M at 1B tokens; the first eval decides
  fresh_lr: 6.0e-4                     # from scratch: one rate for everything
  num_epochs: 1                        # the merged split is the token budget; the cosine fits one pass
  weight_decay: 0.1
  dropout: 0.0
  batch_size: 8                        # 8 x 4096 x 1: 20.4 GB on the shape probe, 44k to 50k tok/s on low-evidence rows
  grad_accumulation_steps: 1
  warmup_fraction: 0.02
  lr_min_factor: 0.1
  seed: 1234
  checkpoint_every_tokens: 50000000
  keep_local_checkpoints: 2            # inert with uploads off: retention deletes only confirmed uploads, so every save stays
  eval_every_tokens: 25000000
  eval_max_batches: 40
  conversation_loss_weighting: false   # plain per-token CE: this is pretraining, not policy
  loss_weight_floor_tokens: 64
  max_evidence_tokens: 4608            # per row; the merged corpus's ratio is about 0.73 against seq 4096
  cluster_refresh_tokens: 0
  dead_quantile: 0.0
